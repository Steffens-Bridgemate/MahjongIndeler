<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA OS title/status-bar colour. Deliberately a fixed neutral (darkslategray): an
         installed standalone PWA's title bar is locked to the manifest theme_color (the OS caches
         it), so a club-specific colour can't apply there anyway — keeping it neutral and static
         everywhere is consistent. Must match manifest.webmanifest's theme_color. -->
    <meta name="theme-color" content="#2f4f4f" />
    <title>Tsumo!</title>
    <meta property="og:title" content="Tsumo!" />
    <meta property="og:description" content="Mahjongclub: aanwezigheid, tafelindeling en scores." />
    <meta property="og:type" content="website" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Vendored locally (not from a CDN) so the PWA's icons render offline — see the
         service worker's offline precache. The CSS references fonts/bootstrap-icons.woff2|woff
         relative to itself. -->
    <link rel="stylesheet" href="lib/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link href="Tsump.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        // GitHub Pages SPA decoder — restores the original route after 404.html bounced us
        // back to index.html with the path encoded as a query string.
        // Pair: see wwwroot/404.html.
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        })(window.location);
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/html5-qrcode/html5-qrcode.min.js"></script>
    <script>
        window.downloadFile = async function (filename, contentBase64) {
            var bytes = Uint8Array.from(atob(contentBase64), c => c.charCodeAt(0));
            if (window.showSaveFilePicker) {
                try {
                    var handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
                    });
                    var writable = await handle.createWritable();
                    await writable.write(bytes);
                    await writable.close();
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }
            var link = document.createElement('a');
            link.download = filename;
            link.href = "data:application/json;base64," + contentBase64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
        window.triggerFileInput = function (inputId) {
            document.getElementById(inputId).click();
        };

        // --- Club style theming ---
        // Sets the --club-* CSS custom properties on <html> from the two brand colours the user
        // picked. Hover and translucent variants are derived here so the settings UI only has to
        // store two hex values. Also overrides Bootstrap's --bs-primary so utility classes
        // (text-primary, border-primary on the Home cards) track the club colour.
        window.applyClubStyle = function (primary, link) {
            var root = document.documentElement;
            function parseHex(hex, fallback) {
                if (!hex) return fallback;
                var m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
                if (!m) return fallback;
                var n = parseInt(m[1], 16);
                return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
            }
            function toHex(c) {
                return '#' + [c.r, c.g, c.b].map(function (v) {
                    return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
                }).join('');
            }
            function darken(c, f) { return { r: c.r * f, g: c.g * f, b: c.b * f }; }
            function rgba(c, a) { return 'rgba(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ',' + a + ')'; }

            var p = parseHex(primary, { r: 0, g: 75, b: 141 });
            var l = parseHex(link, { r: 0, g: 136, b: 204 });
            root.style.setProperty('--club-primary', toHex(p));
            root.style.setProperty('--club-primary-hover', toHex(darken(p, 0.82)));
            root.style.setProperty('--club-primary-soft', rgba(p, 0.1));
            root.style.setProperty('--club-primary-softer', rgba(p, 0.05));
            root.style.setProperty('--club-link', toHex(l));
            root.style.setProperty('--club-link-hover', toHex(darken(l, 0.7)));
            root.style.setProperty('--bs-primary', toHex(p));
            root.style.setProperty('--bs-primary-rgb', p.r + ',' + p.g + ',' + p.b);

            // Note: the PWA/browser top-bar colour (<meta name="theme-color">) is intentionally
            // NOT changed here — it's a fixed neutral, because an installed PWA's title bar can't
            // track a per-club colour anyway (see index.html head). Keeping it static avoids the
            // browser-tab top bar drifting away from the installed-app title bar.

            // Contrast decision: on a light primary fill a white tick/dot washes out, so flip the
            // form-check glyph to black. YIQ perceived brightness, threshold ~150 (biased toward
            // black on borderline colours). The glyphs are the same paths Bootstrap 5.3 ships,
            // only the stroke/fill colour differs.
            var yiq = (p.r * 299 + p.g * 587 + p.b * 114) / 1000;
            var glyph = yiq > 150 ? '%23000' : '%23fff';
            root.style.setProperty('--club-check-image',
                "url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='" + glyph + "' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='m6 10 3 3 6-6'/%3e%3c/svg%3e\")");
            root.style.setProperty('--club-radio-image',
                "url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3e%3ccircle r='2' fill='" + glyph + "'/%3e%3c/svg%3e\")");
        };

        // --- Colour picker from a reference image (Style tab) ---
        // The user pastes (Ctrl+V) a Snipping Tool capture of their club's website, or uploads an
        // image, and clicks a pixel to sample its colour. The reference image is transient (never
        // stored) and is downscaled to maxDim so a large snip can't blow up the canvas.
        window.clubPicker = (function () {
            var canvas = null, dotNetRef = null, pasteHandler = null, hasImage = false, maxBytes = 20 * 1024 * 1024;

            function draw(img, maxDim) {
                var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
                var scale = Math.min(1, maxDim / Math.max(iw, ih));
                var w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
                canvas.width = w; canvas.height = h;
                var ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                hasImage = true;
            }

            function loadUrl(src, maxDim) {
                return new Promise(function (resolve) {
                    var img = new Image();
                    img.onload = function () { try { draw(img, maxDim); resolve(true); } catch (e) { resolve(false); } };
                    img.onerror = function () { resolve(false); };
                    img.src = src;
                });
            }

            function loadBlob(blob, maxDim) {
                if (!blob || blob.size > maxBytes) return Promise.resolve(false);
                var url = URL.createObjectURL(blob);
                return loadUrl(url, maxDim).then(function (ok) { URL.revokeObjectURL(url); return ok; });
            }

            function toHex(r, g, b) {
                return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
            }

            return {
                init: function (canvasId, ref, maxDim) {
                    canvas = document.getElementById(canvasId);
                    dotNetRef = ref; hasImage = false;
                    if (!canvas) return;
                    canvas.addEventListener('click', function (e) {
                        if (!hasImage) return;
                        var rect = canvas.getBoundingClientRect();
                        if (rect.width === 0 || rect.height === 0) return;
                        // Map the click from displayed (CSS) pixels to the canvas's intrinsic pixels.
                        var x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
                        var y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
                        var d = canvas.getContext('2d', { willReadFrequently: true }).getImageData(x, y, 1, 1).data;
                        dotNetRef.invokeMethodAsync('OnColorPicked', toHex(d[0], d[1], d[2]));
                    });
                    // Global paste: only consumed when the clipboard actually holds an image, so it
                    // never interferes with pasting text into the other Settings fields.
                    pasteHandler = function (e) {
                        var items = (e.clipboardData && e.clipboardData.items) || [];
                        for (var i = 0; i < items.length; i++) {
                            if (items[i].type && items[i].type.indexOf('image/') === 0) {
                                var blob = items[i].getAsFile();
                                if (!blob) continue;
                                e.preventDefault();
                                loadBlob(blob, maxDim).then(function (ok) {
                                    dotNetRef.invokeMethodAsync('OnPickerImageLoaded', ok);
                                });
                                return;
                            }
                        }
                    };
                    window.addEventListener('paste', pasteHandler);
                },
                loadFromInput: function (inputId, maxDim) {
                    var input = document.getElementById(inputId);
                    var file = input && input.files && input.files[0];
                    if (input) input.value = '';
                    if (!file || file.type.indexOf('image/') !== 0) return Promise.resolve(false);
                    return loadBlob(file, maxDim);
                },
                dispose: function () {
                    if (pasteHandler) window.removeEventListener('paste', pasteHandler);
                    pasteHandler = null; canvas = null; dotNetRef = null; hasImage = false;
                }
            };
        })();

        // Reads the file currently selected on the given <input type="file">, downscales it to
        // maxWidth (preserving aspect ratio), and returns a data: URL. asJpeg=true encodes as
        // JPEG q0.85 (smaller — used for the wide banner); otherwise PNG (keeps logo transparency).
        // Returns null when no file is selected or it isn't an image. Clears the input afterwards
        // so picking the same file again still fires.
        window.readImageAsDataUrl = function (inputId, maxWidth, asJpeg) {
            return new Promise(function (resolve) {
                var input = document.getElementById(inputId);
                var file = input && input.files && input.files[0];
                if (!file || !file.type || file.type.indexOf('image/') !== 0) {
                    if (input) input.value = '';
                    resolve(null);
                    return;
                }
                var reader = new FileReader();
                reader.onload = function () {
                    var img = new Image();
                    img.onload = function () {
                        var scale = img.naturalWidth > maxWidth ? maxWidth / img.naturalWidth : 1;
                        var w = Math.round(img.naturalWidth * scale);
                        var h = Math.round(img.naturalHeight * scale);
                        var canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        input.value = '';
                        try {
                            resolve(asJpeg ? canvas.toDataURL('image/jpeg', 0.85) : canvas.toDataURL('image/png'));
                        } catch (e) {
                            resolve(null);
                        }
                    };
                    img.onerror = function () { input.value = ''; resolve(null); };
                    img.src = reader.result;
                };
                reader.onerror = function () { input.value = ''; resolve(null); };
                reader.readAsDataURL(file);
            });
        };
        window.focusElement = function (id) {
            var el = document.getElementById(id);
            if (el) el.focus();
        };
        window.scrollToElement = function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            // The jump target sits under a sticky table-nav strip whose height varies (it wraps to
            // several rows when there are many tables). Measure the nearest strip *preceding* this
            // target and reserve exactly that much room, so the strip never covers the top of it.
            var strips = document.querySelectorAll('.table-nav-strip');
            var strip = null;
            strips.forEach(function (s) {
                if (s.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) strip = s;
            });
            // With a preceding strip, reserve its height. Without one (e.g. the first hanchan/table
            // header, which has no strip above it), clear the inline value so the element's CSS
            // scroll-margin-top (.table-scroll-anchor = 3.5rem) applies — pinning to 0 would land it
            // flush under the top bar, so you'd see the first table instead of the header.
            var reserve = strip ? strip.offsetHeight : 0;
            // The import panel's floating preview overlay (fixed, top .75rem) covers the strip and
            // more — reserve whichever occludes the most so the target lands fully below it.
            var overlay = document.querySelector('.import-panel-floating');
            if (overlay) reserve = Math.max(reserve, overlay.offsetHeight + 12);
            if (reserve > 0) el.style.scrollMarginTop = (reserve + 8) + 'px';
            else el.style.scrollMarginTop = '';
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        // Plain smooth scroll honouring the element's CSS scroll-margin-top (no strip compensation).
        // For targets that don't sit under a sticky table-nav strip (e.g. the bottom info cards).
        window.scrollToAnchor = function (id) {
            var el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        window.openHtmlInNewTab = function (html) {
            var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        };
        window.downloadHtmlFile = function (filename, html) {
            var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            var link = document.createElement('a');
            link.download = filename;
            link.href = URL.createObjectURL(blob);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        };
        window.copyToClipboard = function (html, plainText) {
            var htmlBlob = new Blob([html], { type: 'text/html' });
            var textBlob = new Blob([plainText], { type: 'text/plain' });
            var item = new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob });
            return navigator.clipboard.write([item]);
        };
        window.copyTextToClipboard = function (plainText) {
            return navigator.clipboard.writeText(plainText);
        };
        window.copyQrImageToClipboard = async function (svgMarkup, qrSize, title, headerBg, headerFg) {
            // Renders an SVG string to a PNG on an offscreen canvas (with an optional
            // title band above the QR), then writes the result to the clipboard as
            // image/png. Must be called from a user-gesture handler.
            // The canvas is sized to the SVG's natural pixel dimensions (from its
            // viewBox) rather than the passed qrSize. High-version QR codes (needed
            // for ECL-H with large payloads) have SVGs wider than 700 px; shrinking
            // them to 480 px produces ~2.6 px modules that html5-qrcode cannot decode.
            // headerBg/headerFg are optional — when set, the title band is filled with
            // headerBg and the title text is drawn in headerFg. This is how the organizer
            // (blue) and scoring app (green) QRs are visually distinguished in WhatsApp
            // now that on-QR overlays were dropped for hardware-scanner compatibility.
            if (!navigator.clipboard || !navigator.clipboard.write || !window.ClipboardItem) return false;
            try {
                var svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
                var url = URL.createObjectURL(svgBlob);
                var img = new Image();
                try {
                    await new Promise(function (resolve, reject) {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = url;
                    });
                } finally {
                    URL.revokeObjectURL(url);
                }
                var size = img.naturalWidth > 0 ? img.naturalWidth : qrSize;
                var titleHeight = title ? 56 : 0;

                var canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size + titleHeight;
                var ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, size, size + titleHeight);

                if (title) {
                    if (headerBg) {
                        ctx.fillStyle = headerBg;
                        ctx.fillRect(0, 0, size, titleHeight);
                        ctx.fillStyle = headerFg || 'white';
                    } else {
                        ctx.fillStyle = 'black';
                    }
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    // Auto-shrink the font so the title fits within 90% of the QR width.
                    var maxWidth = size * 0.9;
                    var fontSize = 28;
                    ctx.font = 'bold ' + fontSize + 'px sans-serif';
                    while (ctx.measureText(title).width > maxWidth && fontSize > 12) {
                        fontSize -= 1;
                        ctx.font = 'bold ' + fontSize + 'px sans-serif';
                    }
                    ctx.fillText(title, size / 2, titleHeight / 2);
                }
                ctx.drawImage(img, 0, titleHeight, size, size);

                var pngBlob = await new Promise(function (resolve) { canvas.toBlob(resolve, 'image/png'); });
                if (!pngBlob) return false;

                await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
                return true;
            } catch (e) {
                console.warn('copyQrImageToClipboard failed:', e);
                return false;
            }
        };
        window.readClipboardText = async function () {
            // Returns the clipboard's text content, or null if the API is unavailable
            // or the user denied permission. Caller should treat null/throw as "no auto-fill".
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    return await navigator.clipboard.readText();
                }
            } catch (_) { /* permission denied or insecure context */ }
            return null;
        };

        // Camera-based QR scanner backed by html5-qrcode. The caller supplies a div id
        // to render the camera preview in and a DotNet object reference whose
        // [JSInvokable] OnQrScanned(string) is fired on the first successful decode.
        // Resolves on successful start (which means the camera is live), or throws on
        // failure (permission denied, no camera, etc).
        window._qrScanner = null;
        window.startQrScanner = async function (elementId, dotNetRef) {
            if (window._qrScanner) {
                try { await window._qrScanner.stop(); } catch (_) { }
                window._qrScanner = null;
            }
            const scanner = new Html5Qrcode(elementId, { verbose: false });
            window._qrScanner = scanner;
            await scanner.start(
                { facingMode: "environment" },
                // No qrbox => scan the whole frame. fps 15 = more decode attempts per
                // second, which helps when the camera autofocus is sluggish (typical
                // for laptop front cameras).
                { fps: 15 },
                async function (decodedText) {
                    try { await scanner.stop(); } catch (_) { }
                    window._qrScanner = null;
                    dotNetRef.invokeMethodAsync('OnQrScanned', decodedText);
                },
                function (_errorMessage) {
                    // Per-frame "not found yet" errors. Swallow.
                }
            );
        };
        window.stopQrScanner = async function () {
            if (window._qrScanner) {
                try { await window._qrScanner.stop(); } catch (_) { }
                try { window._qrScanner.clear(); } catch (_) { }
                window._qrScanner = null;
            }
        };

        // File-based QR decoding via html5-qrcode's scanFile(). Triggers the hidden
        // <input type="file">; when the user picks an image, decodes it once and
        // routes the decoded text (or the error) back to Blazor.
        window.pickQrImage = function (inputId, workElementId, dotNetRef) {
            const input = document.getElementById(inputId);
            if (!input) return;
            input.onchange = async function (e) {
                const file = e.target.files && e.target.files[0];
                input.value = ''; // allow picking the same file again later
                if (!file) return;
                // Signal the C# side now — picker has produced a file. (We don't flip
                // state before this point because the user might cancel the picker.)
                try { await dotNetRef.invokeMethodAsync('OnQrFileSelected'); } catch (_) { }
                let decoder = null;
                try {
                    decoder = new Html5Qrcode(workElementId, { verbose: false });
                    const result = await decoder.scanFile(file, /* showImage */ false);
                    dotNetRef.invokeMethodAsync('OnQrScanned', result);
                } catch (err) {
                    dotNetRef.invokeMethodAsync('OnQrFileScanFailed', (err && err.toString) ? err.toString() : 'Unknown error');
                } finally {
                    if (decoder) { try { decoder.clear(); } catch (_) { } }
                }
            };
            input.click();
        };

        // --- HID-scanner / paste capture, JS-side ---
        // A USB HID scanner is a keyboard that types the whole URL in a sub-second burst.
        // We accumulate keystrokes natively here and hand the COMPLETE string to .NET in a
        // single invokeMethodAsync call. Doing the per-keystroke work in JS (synchronous, no
        // marshaling) means a slow Blazor event loop — debug build, or a sluggish phone —
        // can't overrun us and drop characters, which is what happens with a controlled
        // <textarea value=@...> bound to @oninput.
        //
        // Framing: result QRs wrap the URL in `[[ … ]]`. A complete framed scan is detected
        // deterministically the instant `]]` arrives — no timer. Unframed input (manual paste
        // or typing) commits on Enter or after a short idle. Neither `[` nor `]` occurs in our
        // URLs, so the markers are unambiguous.
        window.attachScanCapture = function (el, dotNetRef) {
            if (!el) return false;
            window.detachScanCapture(el); // drop any prior binding on this element

            const FRAME_START = '[[';
            const FRAME_END = ']]';
            const UNFRAMED_IDLE_MS = 500;

            let idleTimer = null;
            const clearIdle = function () { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } };

            // Signal "scanning" vs "waiting" to .NET, but ONLY on transitions — never per
            // keystroke — so a burst still costs at most two round-trips (start + end) and can't
            // overrun the event loop.
            let scanning = false;
            const setScanning = function (v) {
                if (scanning === v) return;
                scanning = v;
                dotNetRef.invokeMethodAsync('OnScanProgress', v);
            };

            const submit = function (text) {
                clearIdle();
                setScanning(false);
                el.value = ''; // only ever cleared at commit time, never mid-burst
                dotNetRef.invokeMethodAsync('OnScanComplete', text);
            };

            // Focus tracking: tell .NET when the capture field loses/gains keyboard focus, so the
            // panel can show an "armed vs not listening" indicator. Debounced, because the normal
            // clear+refocus cycle (focusAndClearScanInput) and the post-burst re-arm both blur then
            // immediately refocus. A real loss = the field is still in the DOM but no longer the
            // active element, or the whole window lost focus (user switched to another app such as
            // Teams) — in which case the HID keystrokes go elsewhere and JS cannot pull focus back.
            const FOCUS_DEBOUNCE_MS = 200;
            let focusTimer = null;
            let focusLost = false;
            const clearFocusTimer = function () { if (focusTimer) { clearTimeout(focusTimer); focusTimer = null; } };
            const reportFocus = function (hasFocus) {
                if (focusLost === !hasFocus) return;               // no change since last report
                focusLost = !hasFocus;
                dotNetRef.invokeMethodAsync('OnScanFocusChanged', hasFocus);
            };
            const onFocus = function () { clearFocusTimer(); reportFocus(true); };
            const onBlur = function () {
                clearFocusTimer();
                focusTimer = setTimeout(function () {
                    focusTimer = null;
                    if (!el.isConnected) return;                    // element removed by a state change — not a real loss
                    // Switching apps blurs the window but some browsers keep activeElement on the
                    // textarea, so check hasFocus() too rather than activeElement alone.
                    var armed = document.activeElement === el && document.hasFocus();
                    if (!armed) reportFocus(false);
                }, FOCUS_DEBOUNCE_MS);
            };
            const onWindowBlur = function () { onBlur(); };
            const onWindowFocus = function () {
                if (el.isConnected && document.activeElement === el && document.hasFocus()) onFocus();
            };

            const onInput = function () {
                const value = el.value;
                const trimmed = value.trim();
                if (trimmed.length === 0) { clearIdle(); setScanning(false); return; }
                setScanning(true);                                     // a burst is arriving
                const hasStart = trimmed.startsWith(FRAME_START);
                const hasEnd = trimmed.endsWith(FRAME_END);
                if (hasStart && hasEnd) { submit(value); return; }     // complete framed scan
                if (hasEnd && !hasStart) {                              // front-truncated: focus arrived late
                    clearIdle();
                    setScanning(false);
