<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Tsumo!</title>
    <script>
        // GitHub Pages SPA redirect: converts the path to a query string
        // so index.html can pick it up and restore the route.
        // GitHub Pages serves this single 404.html for any 404 anywhere on the site,
        // so we have to dispatch ourselves: paths under /MahjongIndeler/scoring/ bounce
        // off the scoring app's index.html; everything else bounces off the organizer's.
        var l = window.location;
        var pathSegmentsToKeep = l.pathname.indexOf('/MahjongIndeler/scoring/') === 0
            ? 2  // keep /MahjongIndeler/scoring/
            : 1; // keep /MahjongIndeler/
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body></body>
</html>
